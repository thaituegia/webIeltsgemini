The library opens at nine every morning. From Monday to Friday it closes at seven in the evening. At weekends it closes earlier, at four. People can borrow five books at a time for two weeks. They can keep a book for another week by asking a member of staff, provided nobody else is waiting for it.

On Wednesday afternoons, volunteers help adults practise English. The sessions are free, but visitors must book a place because there are only twelve seats. The first session begins at two o'clock and lasts one hour. Participants read a short story together and then talk about it in pairs.

Library manager Laura says the new room has brought in more students. However, the library is not planning to buy more computers this year. Its next project is a small garden behind the building, where visitors will be able to read outside during the summer.`,questions:[{text:"Why did some students find studying difficult before the change?",options:["The children’s activities were noisy","There were no books","The library closed early"],answer:"The children’s activities were noisy",explanation:"The first paragraph identifies noise from children’s activities."},{text:"At what time does the library close on Sunday? Write ONE number.",answer:"4|four",explanation:"At weekends it closes at four."},{text:"For how many weeks can people initially borrow a book? Write ONE number.",answer:"2|two",explanation:"Books may initially be borrowed for two weeks."},{text:"How much do the Wednesday English sessions cost?",options:["Nothing","Five pounds","Twelve pounds"],answer:"Nothing",explanation:"The sessions are free; booking is still required."},{text:"What is the library’s next project?",options:["A small garden","More computers","Another floor"],answer:"A small garden",explanation:"The final paragraph says the next project is a garden behind the building."}],words:[it("borrow","mượn","Students can borrow five books.","A2"),it("volunteer","tình nguyện viên","A volunteer helps visitors practise English.","A2"),it("provided","với điều kiện là","You can renew the book provided nobody is waiting.","B1")]},B1:{title:"The return of the urban garden",band:4.5,content:`In many cities, small pieces of unused land are being turned into community gardens. These spaces are managed by local residents rather than commercial farms. Participants share tools, decide what to plant and divide the harvest. Although producing food is important, gardeners often describe the social benefits as their main reason for joining.

A project in Northbridge began in 2018 on a former car park. The council offered residents a five-year lease, and twenty households volunteered to help. At first, the group expected to grow vegetables directly in the ground. Tests showed that the soil contained traces of industrial pollution, so they built raised beds and brought in clean soil. This added to the initial cost, but it also made the beds easier for older residents to reach.

Water was another challenge. During the first summer the garden used the public water supply, which was expensive. The group later installed tanks to collect rainwater from a nearby building. These tanks now meet most of the garden's needs, except during unusually dry periods. A local school uses the garden for science lessons, and several pupils have started growing vegetables at home.

The project has limits. Volunteers sometimes disagree about how to use the available space, and not every household has enough spare time to participate. Nevertheless, a survey found that most members knew more of their neighbours than they did before joining. The council has renewed the lease, but it will not provide regular financial support. To cover costs, the group sells a small part of its harvest at a monthly market.`,questions:[{text:"What do many gardeners describe as their main reason for joining?",options:["Social benefits","Commercial profit","Free parking"],answer:"Social benefits",explanation:"Paragraph one distinguishes social benefits from food production."},{text:"Why did residents build raised beds?",options:["The original soil was polluted","The council required more parking","The ground was too wet"],answer:"The original soil was polluted",explanation:"Tests identified traces of industrial pollution in the soil."},{text:"What do the tanks collect? Write ONE word.",answer:"rainwater|rain water",explanation:"The tanks collect rainwater from a nearby building."},{text:"The tanks meet the garden’s water needs in every season without exception. TRUE, FALSE or NOT GIVEN?",answer:"FALSE",explanation:"The text gives an exception: unusually dry periods."},{text:"How does the group raise money for its running costs?",options:["By selling some of its harvest","Through regular council funding","By charging school pupils"],answer:"By selling some of its harvest",explanation:"The final sentence specifies sales at a monthly market."}],words:[it("harvest","vụ thu hoạch; thu hoạch","The group divides the harvest.","B1"),it("resident","cư dân","Local residents manage the garden.","B1"),it("lease","hợp đồng thuê","The council renewed the five-year lease.","B2")]},B2:{title:"When cities become living laboratories",band:6,content:`Urban planners have traditionally relied on forecasts to decide whether a new transport scheme will succeed. Yet forecasts are only as useful as the assumptions behind them. Recently, some cities have adopted a different approach: making temporary changes to public space and observing what happens before committing to expensive construction. These small-scale interventions are sometimes called urban experiments.

In one coastal city, planners used movable barriers to separate a cycle lane from traffic for twelve weeks. Local shopkeepers initially opposed the trial because they expected the loss of parking spaces to reduce sales. During the experiment, however, the number of pedestrians increased and overall retail revenue remained stable. The results did not prove that every shop benefited; businesses selling heavy goods reported greater difficulties with deliveries. The council consequently altered the design to include loading bays before installing a permanent lane.

Temporary projects can also reveal problems that computer models miss. In another city, painted benches in a newly pedestrianised street remained empty during the afternoon. Designers had assumed that people would welcome extra seating, but observation showed that the benches offered no shade in hot weather. Planting trees would eventually address the problem, though movable shelters provided an immediate solution.

Critics argue that the people who take part in these trials may not represent the whole community. A survey conducted only during working hours can exclude commuters, while online feedback may overlook older residents. Researchers therefore recommend collecting evidence at different times and combining numerical counts with interviews. They also caution against interpreting a short trial as proof of long-term success: people may visit a redesigned street simply because it is new.

Experiments are valuable when decision-makers treat them as opportunities to learn rather than demonstrations that a preferred policy is correct. This requires publishing disappointing findings as openly as positive ones. A temporary intervention should inform a lasting decision, not merely provide an attractive photograph for a press release.`,questions:[{text:"What distinguishes the newer planning approach?",options:["Testing temporary changes before permanent construction","Using forecasts without assumptions","Avoiding all observation"],answer:"Testing temporary changes before permanent construction",explanation:"The opening paragraph contrasts temporary observation with committing to construction."},{text:"Why were loading bays added to the final cycle-lane design?",options:["Some businesses had delivery difficulties","Retail revenue fell everywhere","Pedestrians requested extra parking"],answer:"Some businesses had delivery difficulties",explanation:"Businesses selling heavy goods reported delivery problems."},{text:"What was missing from the unused benches? Write ONE word.",answer:"shade",explanation:"Observation showed that the benches offered no shade."},{text:"A survey conducted only during working hours represents every resident equally. TRUE, FALSE or NOT GIVEN?",answer:"FALSE",explanation:"The text says it can exclude commuters."},{text:"The author recommends publishing only successful findings. TRUE, FALSE or NOT GIVEN?",answer:"FALSE",explanation:"Disappointing findings should be published as openly as positive ones."},{text:"Which risk makes a short trial difficult to interpret?",options:["Visitors may be attracted by novelty","Numerical evidence cannot be collected","Permanent construction is always cheaper"],answer:"Visitors may be attracted by novelty",explanation:"A new street may attract visitors simply because it is new."}],words:[it("intervention","sự can thiệp; biện pháp","Temporary interventions help cities test new ideas.","B2"),it("assumption","giả định","A forecast depends on its assumptions.","B2"),it("novelty","sự mới lạ","Initial interest may reflect novelty.","C1"),it("revenue","doanh thu","Retail revenue remained stable.","B2")]},C1:{title:"The hidden cost of an efficient forest",band:7,content:`Forestry has often equated efficiency with uniformity. A plantation containing trees of the same species and age is convenient to harvest and comparatively straightforward to model. Its projected output can be expressed as a single figure, giving investors a reassuring sense of predictability. Ecologists argue, however, that this apparent clarity conceals a less measurable cost: reduced resilience to disturbance.

A diverse forest does not necessarily produce more timber in an uneventful year. Its advantage emerges when conditions depart from expectations. A pathogen that devastates one species may leave its neighbours untouched, while deep-rooted trees can draw moisture from layers inaccessible to shallower-rooted ones. Diversity therefore functions less like a guarantee of higher yield than a portfolio in which risks are distributed. This analogy has limits, since organisms interact rather than merely coexist, but it usefully challenges the assumption that the best annual output must also be the best long-term outcome.

Interpreting the evidence is complicated by the history of the sites being compared. Mixed woodland may occur on less productive land precisely because commercially valuable plantations were established elsewhere. Simple comparisons can consequently underestimate the benefits of diversity. Conversely, enthusiasts sometimes attribute a forest's recovery entirely to species variety while neglecting soil conditions, management practices and the intensity of the original disturbance. Both errors arise from treating correlation as sufficient evidence of causation.

Some managers now favour gradual diversification rather than an abrupt replacement of plantations. Introducing species in small patches allows them to monitor survival and adjust their choices. It can also preserve income during a transition that would otherwise be financially unfeasible. Such pragmatism is occasionally criticised as insufficiently ambitious, but advocates contend that a policy which landowners can sustain is more valuable than an ideal plan they cannot implement.

The dispute is ultimately about what counts as efficiency and whose timescale matters. A measure focused on next year's harvest can reward decisions that expose future communities to considerable risk. Broader accounting would include uncertainty, ecological services and the costs of recovery. It would not eliminate difficult trade-offs, but it would make those trade-offs visible.`,questions:[{text:"Why can a uniform plantation appear attractive to investors?",options:["Its output is easier to predict","It is immune to pathogens","It always supports more wildlife"],answer:"Its output is easier to predict",explanation:"Paragraph one describes a reassuring sense of predictability."},{text:"The portfolio analogy illustrates that diversity…",options:["distributes the risk of disturbances","guarantees higher annual timber output","prevents organisms from interacting"],answer:"distributes the risk of disturbances",explanation:"The author explicitly compares diversity to distributed risks, not guaranteed yield."},{text:"Comparisons may undervalue diversity because mixed woodland occupies less productive land. TRUE, FALSE or NOT GIVEN?",answer:"TRUE",explanation:"Paragraph three explains this historical selection effect."},{text:"What mistaken inference do both sides sometimes make?",options:["Treating correlation as proof of causation","Ignoring every financial constraint","Assuming recovery is impossible"],answer:"Treating correlation as proof of causation",explanation:"The last sentence of paragraph three identifies the shared error."},{text:"Name ONE financial benefit of gradual diversification in TWO words.",answer:"preserve income|preserves income|preserving income",explanation:"Gradual diversification can preserve income during the transition."},{text:"What does the author ultimately favour?",options:["Accounting that makes ecological trade-offs visible","Maximising only next year’s harvest","Eliminating all difficult decisions"],answer:"Accounting that makes ecologi

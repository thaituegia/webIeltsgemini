worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /var/log/nginx/access.log;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65s;
  client_max_body_size 26m;
  client_body_timeout 960s;
  send_timeout 960s;

  server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/tls/site.crt;
    ssl_certificate_key /etc/nginx/tls/site.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:IELTS_TLS:10m;
    ssl_session_timeout 1d;

    location / {
      proxy_pass http://app:3001;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      # Only this proxy can reach the app from the public internet.
      # Replace client-supplied forwarding headers instead of trusting them.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Connection "";
      proxy_connect_timeout 10s;
      proxy_read_timeout 960s;
      proxy_send_timeout 960s;
      proxy_buffering off;
      proxy_request_buffering off;
    }
  }
}
